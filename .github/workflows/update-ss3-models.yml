name: update-ss3-test-models
on: 
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update-ss3-test-models:
    runs-on: ubuntu-latest
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
      
      - name: install libcurl
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --only-upgrade libstdc++6
          sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev

      - name: setup R  
        uses: r-lib/actions/setup-r@v2
      
      - name: install remotes
        run: Rscript -e 'install.packages("remotes")'

      - name: install r4ss
        run: Rscript -e 'remotes::install_github("r4ss/r4ss")'

      - name: Get the general-sizebin Linux SS3 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest successful build-ss3 run on new_general_sizebin_method as of 2026-10-26.
          run_id=40034993275
          gh api "repos/nmfs-ost/ss3-source-code/actions/runs/$run_id" \
            --jq '{head_branch, head_sha, conclusion, path}' | tee "$RUNNER_TEMP/ss3-build.json"
          jq -e '.head_branch == "new_general_sizebin_method" and
                 .head_sha == "6f7eaf0dddf4e3d0de50947c8e438c37014033ef" and
                 .conclusion == "success" and
                 .path == ".github/workflows/build-ss3.yml"' "$RUNNER_TEMP/ss3-build.json"
          gh run download "$run_id" --repo nmfs-ost/ss3-source-code \
            --name ss3-ubuntu-latest --dir "$RUNNER_TEMP/ss3-build"
          sha256sum "$RUNNER_TEMP/ss3-build/ss3_linux"
          sudo install -m 755 "$RUNNER_TEMP/ss3-build/ss3_linux" /usr/local/bin/ss3
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          cat "$RUNNER_TEMP/ss3-build.json" >> "$GITHUB_STEP_SUMMARY"
     
      - name: run models
        run: |
          models <- c("Simple_with_DM_sizefreq", "two_morph_seas_areas")
          files <- c("ss3.par", "ss_summary.sso", "Report.sso", "warning.sso")
          repo_dir <- getwd()
          run_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "general-sizebin-models")
          for (model in models) {
            model_dir <- file.path(run_dir, model)
            copied <- r4ss::copy_SS_inputs(
              dir.old = file.path(repo_dir, "models", model),
              dir.new = model_dir, create.dir = TRUE, recursive = TRUE,
              copy_par = FALSE, copy_exe = FALSE
            )
            if (!isTRUE(copied)) stop("Input copy failed for ", model)
            setwd(model_dir)
            status <- system2("/usr/local/bin/ss3", args = "-nox",
                              stdout = "run.log", stderr = "run.log")
            setwd(repo_dir)
            if (status != 0L) {
              cat(readLines(file.path(model_dir, "run.log")), sep = "\n")
              stop("SS3 failed for ", model, " with exit status ", status)
            }
            outputs <- file.path(model_dir, files)
            if (any(!file.exists(outputs)) || any(file.size(outputs) == 0)) {
              stop("Missing or empty reference outputs for ", model)
            }
            cat(model, "\n")
            cat(readLines(file.path(model_dir, "ss3.par"), n = 1), "\n")
            cat(readLines(file.path(model_dir, "warning.sso")), sep = "\n")
          }
          for (model in models) {
            copied <- file.copy(
              file.path(run_dir, model, files),
              file.path(repo_dir, "models", model, files), overwrite = TRUE
            )
            if (!all(copied)) stop("Reference copy failed for ", model)
          }
        shell: Rscript {0}

      - name: Preserve run outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-sizebin-linux-model-runs
          path: ${{ runner.temp }}/general-sizebin-models/
        
      - name: Setup git user
        uses: fregante/setup-git-user@v2
      
      - name: Commit
        run: |
          git add -- models/Simple_with_DM_sizefreq/{ss3.par,ss_summary.sso,Report.sso,warning.sso} \
                     models/two_morph_seas_areas/{ss3.par,ss_summary.sso,Report.sso,warning.sso}
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate general-sizebin references with Linux build 40034993275" \
              -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          fi
        
      - name: Create Pull Request 
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Regenerate general-sizebin references with Linux build 40034993275
          branch: update-test-models-general-sizebin-linux
          title: 'Regenerate general-sizebin reference outputs with Linux SS3'
          body: |
            Regenerates only the four reference outputs for Simple_with_DM_sizefreq
            and two_morph_seas_areas. Model inputs are unchanged.
            Uses ss3_linux from nmfs-ost/ss3-source-code build-ss3 run 40034993275,
            built from new_general_sizebin_method commit 6f7eaf0dddf4e3d0de50947c8e438c37014033ef.
